services:
  - type: web
    name: drivebase-api
    runtime: node
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: google
      - key: DATA_DIR
        value: .data
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_PICKER_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_PROJECT_NUMBER
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
